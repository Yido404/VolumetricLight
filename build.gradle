plugins { id 'net.minecraftforge.gradle' version '[6.0,6.2)' }
version = '0.1.1'
group = 'com.example.volumetriclight'
base { archivesName = 'volumetriclight-1.20.1' }
java.toolchain.languageVersion = JavaLanguageVersion.of(17)
minecraft {
    mappings channel: 'official', version: '1.20.1'
    copyIdeResources = true
    runs {
        configureEach {
            workingDirectory project.file('run')
            property 'forge.logging.console.level', 'info'
            mods { volumetriclight { source sourceSets.main } }
        }
        client {
            if (project.hasProperty('previewUI')) {
                property 'vlight.previewUI', 'true'
                mods { volumetriclight { source sourceSets.test } }
                args '--width', '1280', '--height', '800'
            }
        }
        server { args '--nogui' }
    }
}
dependencies { minecraft 'net.minecraftforge:forge:1.20.1-47.4.28' }
tasks.withType(JavaCompile).configureEach { options.encoding = 'UTF-8' }
tasks.named('jar', Jar).configure { finalizedBy 'reobfJar' }
tasks.register('selfCheck', JavaExec) {
    dependsOn testClasses
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'com.example.volumetriclight.LightChecks'
    enableAssertions = true
}
tasks.named('check') { dependsOn 'selfCheck' }
